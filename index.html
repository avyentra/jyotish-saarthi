<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#7c3aed" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Jyotish Saarthi" />
<meta name="description" content="Free astrology, birth chart, transits and remedies — no payment needed." />
<title>Jyotish Saarthi</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<style>
  :root {
    --bg: #f6f4fd; --card: #ffffff; --card2: #f1edfb; --ink: #1e1b2e; --muted: #6f6a85;
    --accent: #7c3aed; --line: #ebe7f5; --teal: #14b8a6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", "Noto Sans Gurmukhi", sans-serif; -webkit-tap-highlight-color: transparent; }
  .app { max-width: 480px; margin: 0 auto; min-height: 100%; position: relative; padding-bottom: 120px; }
  .screen { display: none; }
  .screen.on { display: block; }
  .hidden { display: none !important; }

  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); z-index: 50; transition: opacity .4s; }
  #splash.gone { opacity: 0; pointer-events: none; }
  .logo { width: 104px; height: 104px; background: #fff; border-radius: 28px; display: flex; align-items: center; justify-content: center; animation: pop .9s ease-out; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .tag { margin-top: 18px; color: var(--muted); font-size: 14px; letter-spacing: .5px; }

  .top { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 16px; background: linear-gradient(120deg, #7c3aed, #14b8a6); color: #fff; border-radius: 0 0 28px 28px; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #a78bfa, #14b8a6); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 17px; }
  .top h1 { font-size: 17px; font-weight: 600; margin: 0; color: #fff; }
  .top .circle-btn { background: rgba(255,255,255,.22); color: #fff; }
  .circle-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--card); border: 0; color: var(--ink); display: flex; align-items: center; justify-content: center; }
  .circle-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .page-title { font-size: 28px; font-weight: 700; text-align: center; margin: 14px 0 4px; }
  .page-sub { color: var(--muted); font-size: 14px; text-align: center; line-height: 1.5; padding: 0 12px; margin-bottom: 16px; }
  main { padding: 6px 20px 20px; }

  .card { background: var(--card); border-radius: 22px; padding: 18px; margin-bottom: 14px; }
  .section-h { display: flex; justify-content: space-between; align-items: center; margin: 22px 0 12px; font-size: 17px; font-weight: 600; }
  .section-h a { color: var(--accent); font-size: 14px; font-weight: 500; text-decoration: none; }
  .orange { color: var(--accent); }
  .muted { color: var(--muted); }
  .note { font-size: 12px; color: var(--muted); line-height: 1.5; padding: 6px 2px 14px; }
  p { margin: 6px 0; line-height: 1.6; font-size: 15px; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; font-size: 15px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row b { color: var(--muted); font-weight: 500; }

  .seg { display: flex; background: var(--card); border-radius: 999px; padding: 5px; margin-bottom: 16px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--ink); padding: 11px 6px; border-radius: 999px; font-size: 14px; font-weight: 500; }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 600; }

  .hscroll { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; scrollbar-width: none; }
  .hscroll::-webkit-scrollbar { display: none; }
  .hcard { flex: 0 0 82%; scroll-snap-align: start; border-radius: 26px; padding: 20px; min-height: 230px; position: relative; overflow: hidden; background: radial-gradient(circle at 80% 20%, rgba(124,58,237,.55), transparent 55%), linear-gradient(160deg, #ffffff, #f3efff); border: 1px solid var(--line); }
  .hcard .kicker { color: var(--accent); font-size: 14px; font-weight: 500; }
  .hcard h3 { font-size: 21px; line-height: 1.3; margin: 10px 0 14px; font-weight: 700; }
  .hcard .meta { color: var(--muted); font-size: 13px; }
  .hcard .orb { position: absolute; right: -40px; top: -30px; width: 170px; height: 170px; border-radius: 50%; border: 1.5px solid rgba(124,58,237,.5); box-shadow: inset 0 0 40px rgba(124,58,237,.25); }
  .hcard .orb::after { content: ''; position: absolute; inset: 26px; border-radius: 50%; border: 1px dashed rgba(124,58,237,.45); }

  .rings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .rcard { background: var(--card); border-radius: 22px; padding: 16px 8px; display: flex; flex-direction: column; align-items: center; }

  .btn { width: 100%; border: 0; border-radius: 999px; background: var(--accent); color: #fff; padding: 16px; font-size: 16px; font-weight: 600; }
  .btn:disabled { opacity: .5; }
  .btn.ghost { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
  .btn.small { width: auto; padding: 9px 18px; font-size: 14px; }
  .arrow-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); border: 0; color: #fff; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .arrow-btn svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2.2; }

  .item { background: var(--card); border-radius: 22px; padding: 18px; margin-bottom: 12px; display: flex; gap: 14px; align-items: center; }
  .item .body { flex: 1; min-width: 0; }
  .item h4 { margin: 0 0 6px; font-size: 17px; font-weight: 600; }
  .item p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .learn-body { margin-top: 10px; color: #1e1b2e; font-size: 14px; line-height: 1.6; }

  .planet { width: 86px; height: 86px; border-radius: 50%; flex: 0 0 auto; box-shadow: inset -10px -10px 22px rgba(0,0,0,.45), 0 0 24px rgba(124,58,237,.15); }
  .planet-moon { background: radial-gradient(circle at 35% 35%, #f0f0f4, #9a9aa3 55%, #3a3a40); }
  .planet-jupiter { background: repeating-linear-gradient(170deg, #f4b48d 0 9px, #d9826a 9px 15px, #f7d2b4 15px 22px); }
  .planet-mars { background: radial-gradient(circle at 32% 30%, #ffb393, #d9542c 60%, #6e1f10); }

  .pbar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .pbar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s; }
  .prow { display: flex; justify-content: space-between; font-size: 15px; font-weight: 600; }
  .wheel { display: flex; justify-content: center; padding: 6px 0 14px; }

  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  input, select { width: 100%; font-size: 16px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--card2); color: var(--ink); }
  input::placeholder { color: #6e6e76; }
  .timerow { display: flex; gap: 8px; }
  .timerow select { flex: 1; padding: 14px 8px; }
  .inline { display: flex; align-items: center; gap: 8px; margin: 8px 0; color: var(--ink); font-size: 15px; }
  .inline input { width: auto; }
  .placewrap { position: relative; }
  .sugg { position: absolute; left: 0; right: 0; top: 100%; z-index: 30; margin-top: 6px; background: var(--card2); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.6); max-height: 260px; overflow-y: auto; }
  .sugg-item { padding: 13px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .sugg-item:last-child { border-bottom: 0; }
  .sugg-item:hover, .sugg-item:active { background: #303034; }

  .banner { background: var(--card2); border-radius: 20px; padding: 16px; margin-bottom: 14px; border: 1px solid var(--accent); }
  .banner p { margin: 0 0 12px; font-size: 14px; }
  .banner .btns { display: flex; gap: 8px; }
  .banner .btns button { flex: 1; }

  .msg { padding: 11px 14px; border-radius: 18px; margin: 6px 0; max-width: 85%; font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
  .msg.me { background: var(--accent); color: #fff; margin-left: auto; }
  .msg.ai { background: var(--card2); }
  .chatbar { position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%); width: calc(100% - 40px); max-width: 440px; display: flex; gap: 8px; }
  .chatbar input { flex: 1; border-radius: 999px; }
  .chatbar button { border: 0; border-radius: 999px; background: var(--accent); color: #fff; padding: 0 20px; font-weight: 600; }

  nav { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); width: calc(100% - 40px); max-width: 440px; background: #ffffff; border-radius: 999px; display: flex; padding: 8px; box-shadow: 0 12px 30px rgba(0,0,0,.5); z-index: 30; }
  nav button { flex: 1; height: 54px; border: 0; background: transparent; color: var(--ink); border-radius: 999px; display: flex; align-items: center; justify-content: center; }
  nav button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  nav button.on { background: var(--accent); color: #fff; }

  .install { position: fixed; left: 16px; right: 16px; bottom: 96px; max-width: 448px; margin: 0 auto; background: var(--card2); border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 10px; font-size: 14px; z-index: 40; }
  .install button { margin-left: auto; background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 9px 16px; font-weight: 600; }
  .install .x { background: none; color: var(--muted); padding: 4px 8px; }

  /* लॉगिन स्क्रीन: हल्का gradient + सफ़ेद कार्ड */
  .authWrap { background: linear-gradient(170deg, #fff6d6 0%, #ffd9d2 45%, #e6d4ff 100%); border-radius: 28px; padding: 30px 16px 22px; margin-top: 6px; }
  .authHero { text-align: center; }
  .authCard { background: #fff; color: #1c1c1e; border-radius: 22px; padding: 22px 18px; box-shadow: 0 12px 30px rgba(0,0,0,.12); margin-top: 18px; }
  .authCard input { background: #f4f4f6; color: #1c1c1e; border: 1px solid #1e1b2e; margin-top: 8px; }
  .authCard input::placeholder { color: #8e8e93; }
  .aTitle { font-size: 22px; font-weight: 700; color: #1c1c1e; }
  .aSub { color: #6e6e73; font-size: 14px; margin: 6px 0 14px; }
  .gbtn { width: 100%; border: 1px solid #d1d1d6; background: #fff; color: #1c1c1e; border-radius: 999px; padding: 14px; font-size: 16px; font-weight: 600; }
  .aDiv { display: flex; align-items: center; gap: 10px; margin: 16px 0; color: #8e8e93; font-size: 12px; letter-spacing: .5px; }
  .aDiv span { flex: 1; height: 1px; background: #1e1b2e; }
  .aNote { font-size: 12px; color: #6e6e73; margin: 10px 0 0; line-height: 1.5; text-align: center; }
  .qsearch input { margin-bottom: 14px; }
  .qgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 6px; }
  .qtile { background: var(--card); border: 0; border-radius: 18px; padding: 12px 4px; color: var(--ink); font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .qicon { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; }
  .tara { display: flex; align-items: center; gap: 14px; background: linear-gradient(120deg, #7c3aed 0%, #14b8a6 100%); border-radius: 22px; padding: 16px 18px; margin: 4px 0 14px; cursor: pointer; color: #fff; }
  .tara .ticon { width: 56px; height: 56px; border-radius: 50%; background: #fff; color: #f0572a; display: flex; align-items: center; justify-content: center; font-size: 26px; flex: 0 0 auto; }
  .tara .tbadges { display: flex; gap: 6px; margin-bottom: 6px; }
  .tara .tbadges span { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
  .tara .tb-new { background: #fff; color: #e0432a; }
  .tara .tb-free { background: #ffe27a; color: #8a4b00; }
  .tara h4 { margin: 0 0 4px; font-size: 17px; }
  .tara p { margin: 0; font-size: 13px; opacity: .95; }
  .tara .tarrow { margin-left: auto; font-size: 22px; }
  .hgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 6px 0 16px; }
  .hsign { background: var(--card); border: 1px solid transparent; border-radius: 16px; padding: 10px 2px; color: var(--ink); font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .hsign span:first-child { font-size: 22px; }
  .hsign.on { border-color: var(--accent); background: #ede7ff; }
  .hbig { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #7c3aed, #14b8a6); display: flex; align-items: center; justify-content: center; font-size: 30px; flex: 0 0 auto; }
  .hrow2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .htag { background: #f7c948; color: #5a3a00; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
  .hmeta { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 12px; color: #1e1b2e; margin-top: 8px; }
  .hdaily { display: flex; gap: 14px; align-items: center; background: linear-gradient(120deg, #7c3aed, #14b8a6); color: #fff; border-radius: 22px; padding: 16px; margin-bottom: 14px; }
  .hdaily .muted, .hdaily .hmeta { color: #f3efff; }
  .hdaily .htag { background: #fde047; color: #4a3300; }
  .backbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: linear-gradient(120deg, #7c3aed, #14b8a6); color: #fff; }
  .backbtn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.22); color: #fff; font-size: 20px; flex: 0 0 auto; }
  #backTitle { font-weight: 700; font-size: 16px; }
  .svc { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card); border: 0; border-radius: 20px; padding: 14px; margin-bottom: 10px; color: var(--ink); }
  .svcicon { font-size: 26px; width: 48px; height: 48px; border-radius: 14px; background: var(--card2); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .svcicon.big { width: 84px; height: 84px; font-size: 44px; margin: 0 auto 12px; border-radius: 26px; }
  .svcbody { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .svcbody b { font-size: 15px; }
  .svcbody small { color: var(--muted); font-size: 13px; margin-top: 3px; line-height: 1.4; }
  .svcarrow { font-size: 22px; color: var(--accent); }
  .svcdetail { text-align: center; padding: 10px 0 4px; }
  .hscroll { cursor: grab; user-select: none; -webkit-user-select: none; touch-action: pan-x; }
  .hicon { width: 44px; height: 44px; border-radius: 50%; background: var(--card2); display: flex; align-items: center; justify-content: center; font-size: 20px; flex: 0 0 auto; }
  .ktabs { display: flex; gap: 22px; overflow-x: auto; border-bottom: 1px solid rgba(255,255,255,.12); margin: 4px -16px 14px; padding: 0 16px; }
  .ktabs button { background: none; border: 0; color: inherit; opacity: .6; padding: 10px 0; font-weight: 700; font-size: 14px; border-bottom: 3px solid transparent; white-space: nowrap; }
  .ktabs button.on { opacity: 1; border-color: #7c3aed; }
  .kpills { display: flex; gap: 8px; overflow-x: auto; margin: 0 0 12px; }
  .kpills button { border: 0; border-radius: 999px; padding: 7px 14px; background: var(--card); color: inherit; white-space: nowrap; font-size: 13px; }
  .kpills button.on { background: #7c3aed; color: #fff; font-weight: 700; }
  .krow { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0 10px; }
  .kchart { padding: 14px; }
  .ksouth { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); aspect-ratio: 1; border: 1.6px solid #7c3aed; max-width: 320px; margin: 0 auto; }
  .kcell { border: 1px solid rgba(124,58,237,.5); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; text-align: center; padding: 2px; }
  .kcell small { font-size: 9px; opacity: .8; }
  .kh { color: #7c3aed; font-size: 11px; font-weight: 700; }
  .kcell b { font-size: 12px; color: #1e1b2e; }
  .kcenter { border: 1px solid rgba(124,58,237,.5); display: flex; align-items: center; justify-content: center; font-size: 12px; opacity: .7; }
  .kas { color: #db2777 !important; }
  .kcard { padding: 12px 14px; overflow-x: auto; }
  .ktable { width: 100%; border-collapse: collapse; font-size: 13px; }
  .ktable th { font-size: 11px; color: #7c3aed; text-align: left; padding: 8px 4px; font-weight: 700; }
  .ktable td { padding: 9px 4px; border-top: 1px solid rgba(255,255,255,.08); }
  .kred { color: #7c3aed; font-weight: 700; }
  .kb { color: #6fa8ff; }
  .kg { color: #ff6fb5; }
  .mhead { font-weight: 800; color: #7c3aed; margin-bottom: 6px; }
  .mtot { font-weight: 800; padding-top: 10px; }
  .mtag { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .mtag.match { background: #d9f5e3; color: #1b6b3a; }
  .mtag.partial { background: #fff1b8; color: #7a5a00; }
  .mtag.low { background: #f3d6d6; color: #8a2a2a; }
  .mlabel { display: block; font-size: 12px; opacity: .75; margin: 10px 0 4px; }
  .mfield { width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.15); background: var(--card2); color: inherit; font-size: 15px; }
  .mrow { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .mrow select { min-width: 0; }
  .mcheck { display: flex; gap: 8px; align-items: center; margin: 12px 0; font-size: 14px; }

/* आज का गोचर कार्ड */
.gupay { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.gul { margin: 6px 0 4px; padding-left: 18px; font-size: 14px; line-height: 1.7; }
.gochar { padding: 0; overflow: hidden; }
.gbox-top { background: linear-gradient(120deg, #7c3aed, #14b8a6); color: #fff; padding: 14px; }
.gbox-l { font-size: 13px; opacity: .9; }
.gbox-h { font-size: 15px; font-weight: 600; margin-top: 4px; line-height: 1.5; }
.gbox-body { padding: 14px; }
.grow { display: flex; justify-content: space-between; font-size: 14px; padding: 6px 0; border-top: 1px solid var(--line); }
.grow:first-child { border-top: none; }
.gnote { font-size: 12px; margin: 8px 0 0; line-height: 1.5; }
.gq { font-size: 14px; font-weight: 600; margin: 14px 0 8px; }
.gbtns { display: flex; gap: 8px; }
.gbtn { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card2); color: var(--ink); font-weight: 600; cursor: pointer; }
.gbtn.yes { background: var(--teal); border-color: var(--teal); color: #fff; }
.gfb { font-size: 12px; margin-top: 8px; min-height: 16px; }
</style>
</head>
<body>
<div class="app">

  <div id="splash">
    <div class="logo">
      <svg width="60" height="60" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="27" fill="#7c3aed"/><circle cx="41" cy="32" r="19" fill="#ffffff"/></svg>
    </div>
    <div class="tag">Jyotish Saarthi</div>
  </div>

  <!-- Login / Signup -->
  <section id="scrAuth" class="screen">
    <main style="padding-top:30px">
      <div class="page-title" data-i18n="welcomeTitle"></div>
      <div class="page-sub" data-i18n="welcomeSub"></div>
      <div class="seg" data-langseg>
        <button data-setlang="en">English</button>
        <button data-setlang="hi">हिंदी</button>
        <button data-setlang="pa">ਪੰਜਾਬੀ</button>
        <button data-setlang="hg">Hinglish</button>
      </div>
      <div class="authWrap" id="authWrap">
        <div class="authHero">
          <img src="icon.svg" width="72" height="72" alt="" style="border-radius:20px;display:block;margin:0 auto" />
          <div style="font-size:14px;color:#3a3a3c;margin-top:10px" data-i18n="authTag"></div>
        </div>
        <div class="authCard" id="loginCard">
          <div class="aTitle" data-i18n="googleTitle"></div>
          <p class="aSub" data-i18n="googleSub"></p>
          <button class="gbtn" id="googleBtn" data-i18n="googleBtn"></button>
          <div class="aDiv"><span></span><b data-i18n="orLabel"></b><span></span></div>
          <input id="loginEmail" type="email" data-i18n-ph="emailPh" />
          <button class="btn" id="loginBtn" style="margin-top:10px" data-i18n="loginBtn"></button>
          <p id="loginInfo" class="aNote"></p>
          <p class="aNote" data-i18n="authTerms"></p>
        </div>
      </div>
      <div class="card hidden" id="formCard">

const digitSum = n => String(Math.abs(n)).split('').reduce((s, c) => s + Number(c), 0);
const reduce1 = n => { let x = Math.abs(n); while (x > 9) x = digitSum(x); return x; };
const mulankOf = d => reduce1(d.getDate());
const reduceKeepMaster = n => { let x = Math.abs(n); while (x > 9 && x !== 11 && x !== 22 && x !== 33) x = digitSum(x); return x; };
const bhagyankOf = d => reduceKeepMaster(digitSum(d.getDate()) + digitSum(d.getMonth() + 1) + digitSum(d.getFullYear()));
function nameNumber(name) {
  let s = 0;
  for (const ch of name.toUpperCase()) s += CHALDEAN[ch] || 0;
  return s === 0 ? 0 : reduce1(s);
}
function endingScore(ending, m, b) {
  if (ending.length < 4) return 0;
  const reduced = reduce1(ending.split('').reduce((s, c) => s + Number(c), 0));
  let score = 0;
  if (reduced === m || reduced === b) score += 50;
  const last = Number(ending[ending.length - 1]);
  if ((LUCKY[m] || []).includes(last)) score += 25;
  if ((LUCKY[b] || []).includes(last)) score += 25;
  return score;
}
function isoWeekKey(d) {
  const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = x.getUTCDay() || 7;
  x.setUTCDate(x.getUTCDate() + 4 - dayNum);
  const y0 = new Date(Date.UTC(x.getUTCFullYear(), 0, 1));
  return x.getUTCFullYear() * 100 + Math.ceil(((x - y0) / 86400000 + 1) / 7);
}

    : p === 'week' ? isoWeekKey(now) : now.getFullYear();
  const salt = p === 'today' ? 0 : p === 'week' ? 1 : 2;
  const { m } = numbersOf();
  let s = (base * 31 + rashiIdx() * 7 + m * 13 + salt * 1000003) >>> 0;

async function geocode(place) {
  if (!place) return null;
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&addressdetails=1&q=' + encodeURIComponent(place);
    const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
    const data = await res.json();
    if (!data.length) return null;
    return { lat: Number(data[0].lat), lon: Number(data[0].lon), state: (data[0].address || {}).state || null };
  } catch { return null; }
}

async function computeChart(p) {
  const d = p.dob;
  const timeKnown = !!p.birthTime;
  if (!d || !timeKnown) {
    const idx = nameRashiIndex(p.name);
    return {
      nameBased: true, timeKnown: false, placeFound: false,
      moon: idx === null ? null : { index: idx, degree: null },
      sun: null, nakshatra: null, lagna: null,
    };
  }
  const place = p.placeCoords || await geocode(p.place);
  let c;
  try {
    c = Astro.chart({
      year: d.getFullYear(), month: d.getMonth() + 1, day: d.getDate(),
      hour: d.getHours(), minute: d.getMinutes(),
      utcOffsetHours: p.tz ?? 5.5,
      lat: place ? place.lat : null, lon: place ? place.lon : null,
    });
  } catch { return null; }
  if (!place) c.lagna = null;
  return { ...c, timeKnown: true, placeFound: !!place, state: place ? place.state : (p.placeState || null) };
}

function localSuggestions(q) {
  const qs = skeleton(q);
  if (!qs) return [];
  return LOCAL_PLACES
    .filter(([city]) => {
      const cs = skeleton(city);
      return cs.startsWith(qs) || cs.includes(qs) || city.toLowerCase().startsWith(q.toLowerCase());
    })
    .slice(0, 6)
    .map(([city, state]) => ({ label: `${city}, ${state}, India`, lat: null, lon: null, state }));

async function onlineSuggestions(q) {
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=5&countrycodes=in&q=' + encodeURIComponent(q);
    const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });

    return data.map(r => {
      const a = r.address || {};

      return { label: [city, a.state, a.country].filter(Boolean).join(', '), lat: Number(r.lat), lon: Number(r.lon), state: a.state || null };

function initPlaceSearch() {
  $('place').addEventListener('input', () => {
    selectedCoords = null;
    selectedState = null;
    const q = $('place').value.trim();
    clearTimeout(placeTimer);
    if (q.length < 2) { renderSuggestions([]); return; }
    renderSuggestions(localSuggestions(q));
    placeTimer = setTimeout(async () => {
      const online = await onlineSuggestions(q);
      if ($('place').value.trim() !== q) return;
      const seen = new Set();
      const merged = [];
      for (const s of [...online, ...localSuggestions(q)]) {
        const k = s.label.toLowerCase();
        if (!seen.has(k)) { seen.add(k); merged.push(s); }

function parseDobFromText(q) {
  const m = q.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
  if (!m) return null;
  const d = new Date(+m[3], +m[2] - 1, +m[1]);
  if (d.getFullYear() !== +m[3] || d.getMonth() !== +m[2] - 1 || d.getDate() !== +m[1]) return null;
  return d;
}
function parseTimeFromText(q) {
  const m = q.match(/\b(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
  if (!m) return null;
  let h = +m[1];
  const mi = +m[2];
  if (m[3]) h = (h % 12) + (/pm/i.test(m[3]) ? 12 : 0);
  if (h > 23 || mi > 59) return null;
  return { hour: h, minute: mi };
}
function chartForPerson(d, tm) {
  const cands = tm ? [[tm.hour, tm.minute]] : [[0, 0], [12, 0], [23, 59]];
  const uniq = a => [...new Set(a)];
  const moons = [], suns = [], wests = [];
  for (const [h, mi] of cands) {
    const c = Astro.chart({ year: d.getFullYear(), month: d.getMonth() + 1, day: d.getDate(),
      hour: h, minute: mi, utcOffsetHours: 5.5, lat: null, lon: null });
    moons.push(vedicLabel(c.moon.index));
    suns.push(vedicLabel(c.sun.index));
    wests.push(WESTERN_EN[westernSunIdx(c)]);
  }
  const pad = n => String(n).padStart(2, '0');
  return {
    mode: 'other',
    dob: `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`,
    birthTime: tm ? `${pad(tm.hour)}:${pad(tm.minute)}` : 'not given',
    rashi: uniq(moons).join(' / '),
    surya_vedic: uniq(suns).join(' / '),
    surya_western: uniq(wests).join(' / '),
    mulank: mulankOf(d),
    bhagyank: bhagyankOf(d),
    note: tm ? '' : 'Birth time not given. The Moon may change rashi during this day, so all possible Chandra rashis are listed.',
  };
}
function chatContextFor(question) {
  const d = parseDobFromText(question);
  if (!d) return { mode: 'self', ...chatContext() };
  try { return chartForPerson(d, parseTimeFromText(question)); }
  catch (e) { return { mode: 'self', ...chatContext() }; }
}

    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    const p = JSON.parse(raw);
    return { ...p, dob: p.dob ? new Date(p.dob) : null };
  } catch { return null; }
}
function saveProfile(p) {
  localStorage.setItem(KEY, JSON.stringify({ ...p, dob: p.dob ? p.dob.toISOString() : null }));
}
function clearProfile() { localStorage.removeItem(KEY); }

function ring(pct, label) {
  const r = 30, Cc = 2 * Math.PI * r, off = Cc * (1 - pct / 100);
  return `<div class="rcard">
    <svg width="78" height="78" viewBox="0 0 78 78" aria-label="${label} ${pct}%">
      <circle cx="39" cy="39" r="${r}" stroke="#ebe7f5" stroke-width="7" fill="none"/>
      <circle cx="39" cy="39" r="${r}" stroke="#7c3aed" stroke-width="7" fill="none" stroke-linecap="round"
        stroke-dasharray="${Cc.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 39 39)"/>
      <text x="39" y="44" text-anchor="middle" fill="#f5f5f7" font-size="15" font-weight="700">${pct}%</text>
    </svg>
    <div class="muted" style="font-size:13px;margin-top:6px">${label}</div>
  </div>`;
}

function wheelSvg(size, markers = []) {
  const c = size / 2, R = size / 2 - 8;
  let s = `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">`;
  s += `<circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="#7c3aed" stroke-width="1.6" opacity=".8"/>`;
  s += `<circle cx="${c}" cy="${c}" r="${R * 0.74}" fill="none" stroke="#7c3aed" stroke-width="1" opacity=".5"/>`;
  s += `<circle cx="${c}" cy="${c}" r="${R * 0.44}" fill="none" stroke="#7c3aed" stroke-width="1" opacity=".35"/>`;
  for (let i = 0; i < 12; i++) {
    const a = (i * 30 - 90) * Math.PI / 180;
    const x1 = c + R * 0.44 * Math.cos(a), y1 = c + R * 0.44 * Math.sin(a);
    const x2 = c + R * Math.cos(a), y2 = c + R * Math.sin(a);
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#7c3aed" stroke-width="1" opacity=".55"/>`;
    const am = (i * 30 + 15 - 90) * Math.PI / 180;
    const tx = c + R * 0.88 * Math.cos(am), ty = c + R * 0.88 * Math.sin(am);
    s += `<text x="${tx}" y="${ty + 4}" text-anchor="middle" fill="#7c3aed" font-size="${size > 220 ? 11 : 9}" font-family="sans-serif">${esc(rashiName(i))}</text>`;
  }
  for (const m of markers) {
    const a = (m.lon - 90) * Math.PI / 180;
    const rr = R * (m.r || 0.6);
    s += `<circle cx="${c + rr * Math.cos(a)}" cy="${c + rr * Math.sin(a)}" r="${m.size || 6}" fill="${m.color || '#7c3aed'}" stroke="#141414" stroke-width="1.5"/>`;
  }
  return s + '</svg>';
}

function showScreen(id) {

const TAB_PAGES = ['home', 'chart', 'transits', 'remedies', 'listen'];
const navStack = [];
let curService = null;
function serviceTitle() {
  const sv = SERVICES.find(x => x.id === curService);
  return sv ? sv.name : '';
}
function showPg(name, fromBack = false) {
  if (!fromBack && name !== currentPage) {
    navStack.push(currentPage);
    try { history.pushState({ pg: name }, ''); } catch (e) {}
  }
  currentPage = name;
  PAGES.forEach(p => $('pg-' + p).classList.toggle('hidden', p !== name));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.pg === name));
  $('chatBar').classList.toggle('hidden', name !== 'chat');
  const titles = { chart: t('chartTitle'), transits: t('transitTitle'), listen: t('listenTitle'), horo: t('horoTitle'), match: t('matchTitle'), astro: t('ajNavTitle'), remedies: t('remTitle'), service: serviceTitle(), chat: t('chatTitle'), profile: t('profileTitle') };
  $('hGreet').textContent = titles[name] ? titles[name] : (profile ? (lang === 'pa' ? `ਸਤਿ ਸ੍ਰੀ ਅਕਾਲ, ${profile.name}` : lang === 'hi' ? `नमस्ते, ${profile.name}` : `Hello, ${profile.name}`) : '');
  $('backBar').classList.toggle('hidden', TAB_PAGES.includes(name) && name !== 'chart');
  $('backTitle').textContent = titles[name] || '';
  renderPage(name);
  window.scrollTo(0, 0);
}
function goBack() {
  const prev = navStack.pop() || 'home';
  showPg(prev, true);
}
$('backBtn').addEventListener('click', () => {
  if (navStack.length) history.back(); else showPg('home', true);
});
window.addEventListener('popstate', () => { if (profile) goBack(); });

function renderPage(name) {
  if (!profile) return;
  if (name === 'home') renderHome();
  if (name === 'chart') renderChart();
  if (name === 'transits') renderTransits();
  if (name === 'listen') renderListen();
  if (name === 'horo') renderHoro();
  if (name === 'match') renderMatch();
  if (name === 'astro') renderAstro();
  if (name === 'remedies') renderRemedies();
  if (name === 'service') renderService();
  if (name === 'profile') renderProfile();
  renderLangBanner();
}

function setLanguage(l) {
  lang = l;
  if (profile) { profile.lang = l; saveProfile(profile); syncProfile(); }
  applyStaticTranslations();
  if (profile) showPg(currentPage); else showScreen('scrAuth');
}

let kTab = 'charts', kSub = 'lagna', kStyle = 'north', kMode = 'sign';
const K_SUB_KEY = { lagna: 'kdSubLagna', chandra: 'kdSubChandra', surya: 'kdSubSurya' };
const K_CENTERS = [[150, 50], [75, 25], [25, 75], [50, 150], [25, 225], [75, 275], [150, 250], [225, 275], [275, 225], [250, 150], [275, 75], [225, 25]];
const K_SOUTH_POS = [[0, 1], [0, 2], [0, 3], [1, 3], [2, 3], [3, 3], [3, 2], [3, 1], [3, 0], [2, 0], [1, 0], [0, 0]];

function dmsStr(deg) {
  const total = Math.round(deg * 3600);
  const d = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
  return [d, m, s].map(v => String(v).padStart(2, '0')).join(':');
}
function nakOfLon(lon) {
  const span = 360 / 27;
  return { idx: Math.floor(lon / span) % 27, pada: Math.floor((lon % span) / (span / 4)) + 1 };
}
function kRows(c) {
  return [
    { key: 'pAs', code: 'As', sign: c.lagna ? c.lagna.index : null, deg: c.lagna ? c.lagna.degree : null },
    { key: 'pSu', code: 'Su', sign: c.sun.index, deg: c.sun.degree },
    { key: 'pMo', code: 'Mo', sign: c.moon.index, deg: c.moon.degree },
  ];
}
function kBase(c) {
  if (kSub === 'chandra') return c.moon.index;
  if (kSub === 'surya') return c.sun.index;
  return c.lagna ? c.lagna.index : c.moon.index;
}
function kNorthSvg(base, rows) {
  let s = `<svg viewBox="0 0 300 300" width="100%" style="max-width:320px;display:block;margin:0 auto">`;
  s += `<rect x="0" y="0" width="300" height="300" fill="none" stroke="#7c3aed" stroke-width="1.6"/>`;
  s += `<path d="M0 0L300 300M300 0L0 300M150 0L300 150L150 300L0 150Z" fill="none" stroke="#7c3aed" stroke-width="1.4" opacity=".7"/>`;
  for (let h = 1; h <= 12; h++) {
    const [x, y] = K_CENTERS[h - 1];
    const sign = (base + h - 1) % 12;
    const labels = rows.filter(r => r.sign === sign).map(r => r.code).join(', ');
    s += `<text x="${x}" y="${y - 14}" text-anchor="middle" font-size="10" fill="#7c3aed" opacity=".8">${h}</text>`;
    if (labels) s += `<text x="${x}" y="${y + 6}" text-anchor="middle" font-size="13" font-weight="700" fill="${labels.includes('As') ? '#db2777' : '#1e1b2e'}">${labels}</text>`;
  }
  return s + '</svg>';
}
function kSouthHtml(base, rows) {
  let cells = '';
  for (let sg = 0; sg < 12; sg++) {
    const [r, cl] = K_SOUTH_POS[sg];
    const h = ((sg - base + 12) % 12) + 1;
    const labels = rows.filter(x => x.sign === sg).map(x => x.code).join(', ');
    cells += `<div class="kcell" style="grid-row:${r + 1};grid-column:${cl + 1}"><small>${esc(rashiName(sg))}</small><span class="kh">${h}</span><b class="${labels.includes('As') ? 'kas' : ''}">${labels}</b></div>`;
  }
  return `<div class="ksouth">${cells}<div class="kcenter" style="grid-row:2/4;grid-column:2/4">${esc(t('kdSouth'))}</div></div>`;
}
function kTable(c, rows) {
  const lagBase = c.lagna ? c.lagna.index : c.moon.index;
  const head = kMode === 'nak'
    ? [t('kdPlanet'), t('kdNak'), t('kdPada'), t('kdDeg'), t('kdHouse')]
    : [t('kdPlanet'), t('kdSign'), t('kdLord'), t('kdDeg'), t('kdHouse')];
  const body = rows.map(r => {
    if (r.sign === null) return `<tr><td>${t(r.key)}</td><td colspan="4" class="muted">${t('dash')}</td></tr>`;
    const lon = r.sign * 30 + r.deg;
    const house = ((r.sign - lagBase + 12) % 12) + 1;
    let mid;
    if (kMode === 'nak') {
      const n = nakOfLon(lon);
      mid = `<td>${esc(C().nak[n.idx])}</td><td>${n.pada}</td>`;
    } else {
      mid = `<td>${esc(rashiName(r.sign))}</td><td>${esc(lordName(RASHIS[r.sign].lord))}</td>`;
    }
    return `<tr><td>${t(r.key)}</td>${mid}<td>${dmsStr(r.deg)}</td><td class="kred">${house}</td></tr>`;
  }).join('');
  return `<table class="ktable"><thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;
}

/* ---------- मिलान (Ashtakoot, 36 गुण) ---------- */
const MATCH_DEVA = [0, 4, 6, 7, 12, 14, 16, 21, 26];
const MATCH_MANU = [1, 3, 5, 10, 11, 19, 20, 24, 25];
const NAK_GANA = Array.from({ length: 27 }, (_, i) => MATCH_DEVA.includes(i) ? 'D' : MATCH_MANU.includes(i) ? 'M' : 'R');
const NAK_YONI = ['Horse', 'Elephant', 'Goat', 'Serpent', 'Serpent', 'Dog', 'Cat', 'Goat', 'Cat', 'Rat', 'Rat', 'Cow', 'Buffalo', 'Tiger', 'Buffalo', 'Tiger', 'Deer', 'Deer', 'Dog', 'Monkey', 'Mongoose', 'Monkey', 'Lion', 'Horse', 'Lion', 'Cow', 'Elephant'];
const YONI_ENEMY = new Set(['Buffalo|Horse', 'Elephant|Lion', 'Goat|Monkey', 'Mongoose|Serpent', 'Deer|Dog', 'Cat|Rat', 'Cow|Tiger']);
const NADI_OF = Array.from({ length: 27 }, (_, i) => [0, 5, 6, 11, 12, 17, 18, 23, 24].includes(i) ? 0 : [1, 4, 7, 10, 13, 16, 19, 22, 25].includes(i) ? 1 : 2);
const VARNA_OF = [2, 1, 0, 3, 2, 1, 0, 3, 2, 1, 0, 3];
const VASHYA_OF = ['C', 'C', 'M', 'J', 'V', 'M', 'M', 'K', 'M', 'J', 'M', 'J'];
const VASHYA_PTS = { CM: 1, CJ: 0.5, JM: 0.5 };
const BHAKOOT_BAD = [2, 5, 6, 8, 9, 12];
const LORD_OF = ['Mars', 'Venus', 'Mercury', 'Moon', 'Sun', 'Mercury', 'Venus', 'Mars', 'Jupiter', 'Saturn', 'Saturn', 'Jupiter'];
const LORD_FRIEND = { Sun: ['Moon', 'Mars', 'Jupiter'], Moon: ['Sun', 'Mercury'], Mars: ['Sun', 'Moon', 'Jupiter'], Mercury: ['Sun', 'Venus'], Jupiter: ['Sun', 'Moon', 'Mars'], Venus: ['Mercury', 'Saturn'], Saturn: ['Mercury', 'Venus'] };
const LORD_ENEMY = { Sun: ['Venus', 'Saturn'], Moon: [], Mars: ['Mercury'], Mercury: ['Moon'], Jupiter: ['Mercury', 'Venus'], Venus: ['Sun', 'Moon'], Saturn: ['Sun', 'Moon', 'Mars'] };
function lordRel(a, b) {
  if (a === b || LORD_FRIEND[a].includes(b)) return 2.5;
  if (LORD_ENEMY[a].includes(b)) return 0;
  return 1.25;
}
function ashtakoot(b, g) {
  // b = लड़का, g = लड़की; दोनों के { moon: राशि index, nak: नक्षत्र index }
  const taraOk = n => { const r = n % 9; return r !== 0 && r !== 3 && r !== 5 && r !== 7; };
  const ya = NAK_YONI[b.nak], yg = NAK_YONI[g.nak];
  const yoniScore = ya === yg ? 4 : YONI_ENEMY.has([ya, yg].sort().join('|')) ? 0 : 2;
  const ganaScore = NAK_GANA[b.nak] === NAK_GANA[g.nak] ? 6 : [NAK_GANA[b.nak], NAK_GANA[g.nak]].sort().join('') === 'DM' ? 5 : 0;
  const vashyaScore = VASHYA_OF[b.moon] === VASHYA_OF[g.moon] ? 2 : (VASHYA_PTS[[VASHYA_OF[b.moon], VASHYA_OF[g.moon]].sort().join('')] || 0);
  const maitriScore = lordRel(LORD_OF[b.moon], LORD_OF[g.moon]) + lordRel(LORD_OF[g.moon], LORD_OF[b.moon]);
  const bhakootScore = BHAKOOT_BAD.includes(((g.moon - b.moon + 12) % 12) + 1) ? 0 : 7;
  const nadiScore = NADI_OF[b.nak] === NADI_OF[g.nak] ? 0 : 8;
  const varnaScore = VARNA_OF[b.moon] >= VARNA_OF[g.moon] ? 1 : 0;
  const taraScore = (taraOk(((g.nak - b.nak + 27) % 27) + 1) ? 1.5 : 0) + (taraOk(((b.nak - g.nak + 27) % 27) + 1) ? 1.5 : 0);
  return [
    { key: 'mVarna', max: 1, score: varnaScore },
    { key: 'mVashya', max: 2, score: vashyaScore },
    { key: 'mTara', max: 3, score: taraScore },
    { key: 'mYoni', max: 4, score: yoniScore },
    { key: 'mMaitri', max: 5, score: maitriScore },
    { key: 'mGana', max: 6, score: ganaScore },
    { key: 'mBhakoot', max: 7, score: bhakootScore },
    { key: 'mNadi', max: 8, score: nadiScore },
  ];
}

const fmtDate = d => d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
async function matchCalc() {
  const name = $('mName').value.trim();
  const dobVal = $('mDob').value;
  const hh = $('mHh').value, mm = $('mMm').value, ap = $('mAp').value;
  const place = $('mPlace').value.trim();
  if (!name || !dobVal || !hh || mm === '') { alert(t('mNeedAll')); return; }
  const [y, mo, da] = dobVal.split('-').map(Number);
  const h24 = (Number(hh) % 12) + (ap === 'PM' ? 12 : 0);
  const pc = Astro.chart({ year: y, month: mo, day: da, hour: h24, minute: Number(mm), utcOffsetHours: 5.5 });
  const coords = await geocode(place);
  const youDob = profile.dob ? new Date(profile.dob) : null;
  const you = {
    name: profile.name,
    date: youDob ? fmtDate(youDob) : '—',
    time: profile.birthTime ? `${profile.birthTime.hh}:${profile.birthTime.mm} ${profile.birthTime.ap}` : '—',
    place: profile.place || '—',
    lat: profile.placeCoords ? profile.placeCoords.lat.toFixed(2) : '—',
    lon: profile.placeCoords ? profile.placeCoords.lon.toFixed(2) : '—',
  };
  const partner = {
    name,
    date: fmtDate(new Date(y, mo - 1, da)),
    time: `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')} ${ap}`,
    place: place || '—',
    lat: coords ? coords.lat.toFixed(2) : '—',
    lon: coords ? coords.lon.toFixed(2) : '—',
  };
  const youRec = { moon: profile.chart.moon.index, nak: profile.chart.nakshatra.index };
  const partnerRec = { moon: pc.moon.index, nak: pc.nakshatra.index };
  const youIsBoy = !$('mSwap').checked;
  matchResult = {
    boy: youIsBoy ? you : partner,
    girl: youIsBoy ? partner : you,
    rows: youIsBoy ? ashtakoot(youRec, partnerRec) : ashtakoot(partnerRec, youRec),
  };
  renderMatch();
}

function horoFor(sign, offset) {

  const base = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  let s = (base * 31 + sign * 17 + 7) >>> 0;

  const hour = 1 + (rnd() % 12);
  const min = rnd() % 60;
  const time = `${String(hour).padStart(2, '0')}:${String(min).padStart(2, '0')} ${rnd() % 2 ? 'AM' : 'PM'}`;
  const mood = ['😊', '😌', '🤔', '😎', '🙂'][rnd() % 5];

}

           <span>${t('horoMood')}: ${data.mood}</span>
           <span>${t('horoNum')}: ${data.lucky}</span>

         </div>
       </div>
     </div>
     <div class="seg">${offs.map(([o, l]) => `<button data-hoff="${o}" class="${o === horoOffset ? 'on' : ''}">${l}</button>`).join('')}</div>

       <div class="item" style="align-items:flex-start">

$('pg-horo').addEventListener('click', e => {
  const s = e.target.closest('[data-sign]');
  if (s) { horoSign = Number(s.dataset.sign); renderHoro(); return; }
  const o = e.target.closest('[data-hoff]');
  if (o) { horoOffset = Number(o.dataset.hoff); renderHoro(); }
});

function speakIdx(i) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(C().listen[i].sub);
  u.lang = lang === 'hi' ? 'hi-IN' : lang === 'pa' ? 'pa-IN' : 'en-IN';
  u.rate = 0.9;
  speechSynthesis.speak(u);
}

/* ============ कार्ड्स को माउस से बाएँ-दाएँ खींचना (लैपटॉप) ============ */
(function enableDragScroll() {
  let el = null, startX = 0, startLeft = 0;
  document.addEventListener('pointerdown', e => {
    const h = e.target.closest && e.target.closest('.hscroll');
    if (!h || e.pointerType !== 'mouse') return;
    el = h; startX = e.clientX; startLeft = h.scrollLeft;
    h.style.scrollSnapType = 'none';
    h.style.cursor = 'grabbing';
  });
  document.addEventListener('pointermove', e => {
    if (!el) return;
    el.scrollLeft = startLeft - (e.clientX - startX);
  });
  const end = () => {
    if (!el) return;
    el.style.scrollSnapType = '';
    el.style.cursor = '';
    el = null;
  };
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', end);
})();

async function doLogout() {

/* ============ Astrologer portal (Gmail आधारित) ============ */
let astroView = null; // null = अपने-आप तय, 'join' या 'login'
function renderAstro() {
  if (!profile) return;
  const a = profile.astro;
  const view = astroView || (a && a.joined ? 'customers' : 'join');
  $('pg-astro').innerHTML = view === 'join' ? astroJoinHtml() : view === 'login' ? astroLoginHtml() : astroCustomersHtml(a);
}
function astroJoinHtml() {
  return `<div class="page-title" style="text-align:center">${t('ajTitle')}</div>
   <div class="page-sub" style="text-align:center">${t('ajSub')}</div>
   <div class="card">
     <label class="mlabel">${t('ajName')}</label>
     <input id="ajName" class="mfield" type="text" placeholder="${esc(t('ajNamePh'))}" value="${esc(profile.name || '')}" />
     <label class="mlabel">${t('ajGmail')}</label>
     <input id="ajGmail" class="mfield" type="email" placeholder="name@gmail.com" />
     <button class="btn" data-aj="submit" style="margin-top:14px">${t('ajContinue')} →</button>
     <p class="note" style="text-align:center"><button class="alink" data-aj="login">${t('ajHaveAcc')}</button></p>
   </div>`;
}
function astroLoginHtml() {
  return `<div class="page-title" style="text-align:center">${t('ajWelcome')}</div>
   <div class="page-sub" style="text-align:center">${t('ajLoginSub')}</div>
   <div class="card">
     <button class="btn" data-aj="google">${t('ajGoogle')}</button>
     <p class="note" style="text-align:center"><button class="alink" data-aj="signup">${t('ajNew')}</button></p>
   </div>`;
}
function astroCustomersHtml(a) {
  return `<div class="page-title">${t('ajCustomers')}</div>
   <div class="page-sub">${esc(a.name)} · ${esc(a.email)}</div>
   <div class="qsearch"><input id="ajSearch" type="search" placeholder="${esc(t('ajSearch'))}" /></div>
   <div class="card"><p class="muted">${t('ajEmpty')}</p></div>
   <div class="kpills"><button data-aj="leave">${t('ajLeave')}</button></div>`;
}
$('pg-astro').addEventListener('click', async e => {
  if (!profile) return;
  const b = e.target.closest('[data-aj]');
  if (!b) return;
  const act = b.dataset.aj;
  if (act === 'submit') {
    const name = $('ajName').value.trim();
    const email = $('ajGmail').value.trim();
    if (!name || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { alert(t('ajInvalid')); return; }
    profile.astro = { name, email, joined: true };
    saveProfile(profile); syncProfile();
    astroView = null; renderAstro();
  } else if (act === 'login') { astroView = 'login'; renderAstro(); }
  else if (act === 'signup') { astroView = 'join'; renderAstro(); }
  else if (act === 'google') {
    if (!sb) { alert(t('ajNoLogin')); return; }
    const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.href.split('#')[0] } });
    if (error) alert(error.message);
  } else if (act === 'leave') {
    profile.astro = null; saveProfile(profile);
    astroView = null; renderAstro();
  }
});
/* ============ प्रोफ़ाइल संपादन: मौजूदा जानकारी फ़ॉर्म में भरकर खोलें ============ */
let editMode = false;
function openEditProfile() {
  if (!profile) return;
  editMode = true;
  $('name').value = profile.name || '';
  const d = profile.dob;
  $('dob').value = d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` : '';
  $('place').value = profile.place || '';
  selectedCoords = profile.placeCoords || null;
  selectedState = profile.placeState || null;
  if (profile.birthTime) {
    $('timeUnknown').checked = false;
    $('hh').value = profile.birthTime.hh;
    $('mm').value = String(Number(profile.birthTime.mm));
    $('ap').value = profile.birthTime.ap;
  } else {
    $('timeUnknown').checked = true;
  }
  $('timeUnknown').dispatchEvent(new Event('change'));
  $('tz').value = String(profile.tz ?? 5.5);
  $('cancelEdit').style.display = '';
  $('saveBtn').textContent = 'Save';
  $('loginCard').classList.add('hidden');
  $('formCard').classList.remove('hidden');
  showScreen('scrAuth');
  window.scrollTo(0, 0);
}
function closeEditProfile() {
  editMode = false;
  $('cancelEdit').style.display = 'none';
  $('saveBtn').textContent = t('start');
  $('formCard').classList.add('hidden');
}
$('cancelEdit').addEventListener('click', () => { closeEditProfile(); enterApp(); });

$('pg-profile').addEventListener('click', e => {
  if (e.target.closest('[data-edit-profile]')) { openEditProfile(); return; }
  if (e.target.closest('[data-astro-open]')) { astroView = null; showPg('astro'); return; }
  if (e.target.closest('[data-logout]')) doLogout();
});

/* ============ शुरुआत ============ */
function enterApp() {
  const initial = (profile.name || '?').trim().charAt(0).toUpperCase();
  $('avatar').textContent = initial;
  applyStaticTranslations();
  showScreen('scrApp');
  showPg('home');
}

// भाषा चुनने वाला बटन (लॉगिन और प्रोफ़ाइल दोनों पर)
document.querySelectorAll('[data-setlang]').forEach(b => b.addEventListener('click', () => setLanguage(b.dataset.setlang)));

$('saveBtn').addEventListener('click', async () => {
  const name = $('name').value.trim();
  const dobVal = $('dob').value;
  if (!name) { alert(t('alertName')); return; }

  const [y, mo, da] = dobVal ? dobVal.split('-').map(Number) : [0, 0, 0];
  let birthTime = null;
  let hour24 = 0, minute = 0;
  if (dobVal && !$('timeUnknown').checked) {
    if (!$('hh').value || $('mm').value === '') { alert(t('alertTime')); return; }
    hour24 = (Number($('hh').value) % 12) + ($('ap').value === 'PM' ? 12 : 0);
    minute = Number($('mm').value);
    birthTime = { hh: $('hh').value, mm: String(minute).padStart(2, '0'), ap: $('ap').value };
  }
  profile = {
    ...(editMode && profile ? profile : {}),
    name,
    dob: dobVal ? new Date(y, mo - 1, da, hour24, minute) : null,
    place: $('place').value.trim(),
    placeCoords: selectedCoords,
    placeState: selectedState,
    birthTime,
    tz: Number($('tz').value),
    lang,
    langAsked: editMode && profile ? profile.langAsked : false,
  };
  $('saveBtn').disabled = true;
  $('saveBtn').textContent = t('saving');
  profile.chart = await computeChart(profile);
  if (profile.chart && profile.chart.state) profile.state = profile.chart.state;
  else profile.state = profile.placeState || null;
  $('saveBtn').disabled = false;
  $('saveBtn').textContent = t('start');
  saveProfile(profile);
  syncProfile();
  if (editMode) closeEditProfile();
  enterApp();
});

document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => showPg(b.dataset.pg)));

$('langBanner').addEventListener('click', e => {
  const yes = e.target.closest('[data-bn-yes]');
  const no = e.target.closest('[data-bn-no]');
  if (yes) { profile.langAsked = true; saveProfile(profile); setLanguage(yes.dataset.bnYes); }
  if (no) { profile.langAsked = true; saveProfile(profile); renderLangBanner(); }
});

$('pg-home').addEventListener('input', e => {
  if (e.target.id !== 'homeSearch') return;
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('#pg-home .qtile').forEach(el => {
    el.style.display = el.dataset.label.toLowerCase().includes(q) ? '' : 'none';

$('pg-home').addEventListener('click', e => {
  const quick = e.target.closest('[data-quick]');
  if (quick) {
    const k = quick.dataset.quick;
    if (k === 'horo') showPg('horo');
    else if (k === 'kundali') showPg('chart');
    else if (k === 'chat') showPg('chat');
    else if (k === 'match') showPg('match');
    return;
  }
  const p = e.target.closest('[data-period]');
  if (p) { period = p.dataset.period; renderHome(); return; }
  if (e.target.closest('#openChat')) { showPg('chat'); return; }
  const link = e.target.closest('[data-pg-link]');
  if (link) { e.preventDefault(); showPg(link.dataset.pgLink); return; }
  const learn = e.target.closest('[data-learn]');
  if (learn) learn.querySelector('.learn-body').classList.toggle('hidden');
});

$('pg-listen').addEventListener('click', e => {
  const s = e.target.closest('[data-speak]');
  if (s) { speakIdx(Number(s.dataset.speak)); return; }
  if (e.target.closest('[data-stop]') && 'speechSynthesis' in window) speechSynthesis.cancel();
});

$('btnProfile').addEventListener('click', () => showPg('profile'));

  if (!confirm(t('resetConfirm'))) return;
  clearProfile();
  profile = null;
  location.reload();
});

$('chatSend').addEventListener('click', sendChat);
$('chatIn').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });

/* PWA */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; $('installBox').classList.remove('hidden'); });
$('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  $('installBox').classList.add('hidden');
});
$('installX').addEventListener('click', () => $('installBox').classList.add('hidden'));

/* boot */
profile = loadProfile();
if (profile && profile.lang) lang = profile.lang;
fillTimeSelects();
initPlaceSearch();
initLogin();
$('googleBtn').addEventListener('click', async () => {
  if (!sb) return;
  const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.href.split('#')[0] } });
  if (error) $('loginInfo').textContent = t('loginFail') + error.message;
});
applyStaticTranslations();
setTimeout(() => {
  $('splash').classList.add('gone');
  setTimeout(() => {
    $('splash').style.display = 'none';
    if (profile && !sb) enterApp(); else if (!authHandled) showScreen('scrAuth');
  }, 400);
}, 1500);
</script>
