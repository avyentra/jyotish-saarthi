<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#141414" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Jyotish Saarthi" />
<meta name="description" content="Free astrology, birth chart, transits and remedies — no payment needed." />
<title>Jyotish Saarthi</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<style>
  :root {
    --bg: #141414; --card: #1d1d1f; --card2: #262628; --ink: #f5f5f7; --muted: #8e8e93;
    --accent: #f08a4b; --line: #2c2c2e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", "Noto Sans Gurmukhi", sans-serif; -webkit-tap-highlight-color: transparent; }
  .app { max-width: 480px; margin: 0 auto; min-height: 100%; position: relative; padding-bottom: 120px; }
  .screen { display: none; }
  .screen.on { display: block; }
  .hidden { display: none !important; }

  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); z-index: 50; transition: opacity .4s; }
  #splash.gone { opacity: 0; pointer-events: none; }
  .logo { width: 104px; height: 104px; background: #fff; border-radius: 28px; display: flex; align-items: center; justify-content: center; animation: pop .9s ease-out; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .tag { margin-top: 18px; color: var(--muted); font-size: 14px; letter-spacing: .5px; }

  .top { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 8px; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #f7a36a, #e0703a); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 17px; }
  .top h1 { font-size: 17px; font-weight: 600; margin: 0; }
  .circle-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--card); border: 0; color: var(--ink); display: flex; align-items: center; justify-content: center; }
  .circle-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .page-title { font-size: 28px; font-weight: 700; text-align: center; margin: 14px 0 4px; }
  .page-sub { color: var(--muted); font-size: 14px; text-align: center; line-height: 1.5; padding: 0 12px; margin-bottom: 16px; }
  main { padding: 6px 20px 20px; }

  .card { background: var(--card); border-radius: 22px; padding: 18px; margin-bottom: 14px; }
  .section-h { display: flex; justify-content: space-between; align-items: center; margin: 22px 0 12px; font-size: 17px; font-weight: 600; }
  .section-h a { color: var(--accent); font-size: 14px; font-weight: 500; text-decoration: none; }
  .orange { color: var(--accent); }
  .muted { color: var(--muted); }
  .note { font-size: 12px; color: var(--muted); line-height: 1.5; padding: 6px 2px 14px; }
  p { margin: 6px 0; line-height: 1.6; font-size: 15px; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; font-size: 15px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row b { color: var(--muted); font-weight: 500; }

  .seg { display: flex; background: var(--card); border-radius: 999px; padding: 5px; margin-bottom: 16px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--ink); padding: 11px 6px; border-radius: 999px; font-size: 14px; font-weight: 500; }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 600; }

  .hscroll { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; scrollbar-width: none; }
  .hscroll::-webkit-scrollbar { display: none; }
  .hcard { flex: 0 0 82%; scroll-snap-align: start; border-radius: 26px; padding: 20px; min-height: 230px; position: relative; overflow: hidden; background: radial-gradient(circle at 80% 20%, rgba(240,138,75,.55), transparent 55%), linear-gradient(160deg, #2a2a2d, #1b1b1d); border: 1px solid var(--line); }
  .hcard .kicker { color: var(--accent); font-size: 14px; font-weight: 500; }
  .hcard h3 { font-size: 21px; line-height: 1.3; margin: 10px 0 14px; font-weight: 700; }
  .hcard .meta { color: var(--muted); font-size: 13px; }
  .hcard .orb { position: absolute; right: -40px; top: -30px; width: 170px; height: 170px; border-radius: 50%; border: 1.5px solid rgba(240,138,75,.5); box-shadow: inset 0 0 40px rgba(240,138,75,.25); }
  .hcard .orb::after { content: ''; position: absolute; inset: 26px; border-radius: 50%; border: 1px dashed rgba(240,138,75,.45); }

  .rings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .rcard { background: var(--card); border-radius: 22px; padding: 16px 8px; display: flex; flex-direction: column; align-items: center; }

  .btn { width: 100%; border: 0; border-radius: 999px; background: var(--accent); color: #fff; padding: 16px; font-size: 16px; font-weight: 600; }
  .btn:disabled { opacity: .5; }
  .btn.ghost { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
  .btn.small { width: auto; padding: 9px 18px; font-size: 14px; }
  .arrow-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); border: 0; color: #fff; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .arrow-btn svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2.2; }

  .item { background: var(--card); border-radius: 22px; padding: 18px; margin-bottom: 12px; display: flex; gap: 14px; align-items: center; }
  .item .body { flex: 1; min-width: 0; }
  .item h4 { margin: 0 0 6px; font-size: 17px; font-weight: 600; }
  .item p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .learn-body { margin-top: 10px; color: #e5e5ea; font-size: 14px; line-height: 1.6; }

  .planet { width: 86px; height: 86px; border-radius: 50%; flex: 0 0 auto; box-shadow: inset -10px -10px 22px rgba(0,0,0,.45), 0 0 24px rgba(240,138,75,.15); }
  .planet-moon { background: radial-gradient(circle at 35% 35%, #f0f0f4, #9a9aa3 55%, #3a3a40); }
  .planet-jupiter { background: repeating-linear-gradient(170deg, #f4b48d 0 9px, #d9826a 9px 15px, #f7d2b4 15px 22px); }
  .planet-mars { background: radial-gradient(circle at 32% 30%, #ffb393, #d9542c 60%, #6e1f10); }

  .pbar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .pbar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s; }
  .prow { display: flex; justify-content: space-between; font-size: 15px; font-weight: 600; }
  .wheel { display: flex; justify-content: center; padding: 6px 0 14px; }

  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  input, select { width: 100%; font-size: 16px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--card2); color: var(--ink); }
  input::placeholder { color: #6e6e76; }
  .timerow { display: flex; gap: 8px; }
  .timerow select { flex: 1; padding: 14px 8px; }
  .inline { display: flex; align-items: center; gap: 8px; margin: 8px 0; color: var(--ink); font-size: 15px; }
  .inline input { width: auto; }
  .placewrap { position: relative; }
  .sugg { position: absolute; left: 0; right: 0; top: 100%; z-index: 30; margin-top: 6px; background: var(--card2); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.6); max-height: 260px; overflow-y: auto; }
  .sugg-item { padding: 13px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .sugg-item:last-child { border-bottom: 0; }
  .sugg-item:hover, .sugg-item:active { background: #303034; }

  .banner { background: var(--card2); border-radius: 20px; padding: 16px; margin-bottom: 14px; border: 1px solid var(--accent); }
  .banner p { margin: 0 0 12px; font-size: 14px; }
  .banner .btns { display: flex; gap: 8px; }
  .banner .btns button { flex: 1; }

  .msg { padding: 11px 14px; border-radius: 18px; margin: 6px 0; max-width: 85%; font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
  .msg.me { background: var(--accent); color: #fff; margin-left: auto; }
  .msg.ai { background: var(--card2); }
  .chatbar { position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%); width: calc(100% - 40px); max-width: 440px; display: flex; gap: 8px; }
  .chatbar input { flex: 1; border-radius: 999px; }
  .chatbar button { border: 0; border-radius: 999px; background: var(--accent); color: #fff; padding: 0 20px; font-weight: 600; }

  nav { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); width: calc(100% - 40px); max-width: 440px; background: #1d1d1f; border-radius: 999px; display: flex; padding: 8px; box-shadow: 0 12px 30px rgba(0,0,0,.5); z-index: 30; }
  nav button { flex: 1; height: 54px; border: 0; background: transparent; color: var(--ink); border-radius: 999px; display: flex; align-items: center; justify-content: center; }
  nav button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  nav button.on { background: var(--accent); color: #fff; }

  .install { position: fixed; left: 16px; right: 16px; bottom: 96px; max-width: 448px; margin: 0 auto; background: var(--card2); border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 10px; font-size: 14px; z-index: 40; }
  .install button { margin-left: auto; background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 9px 16px; font-weight: 600; }
  .install .x { background: none; color: var(--muted); padding: 4px 8px; }
</style>
</head>
<body>
<div class="app">

  <div id="splash">
    <div class="logo">
      <svg width="60" height="60" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="27" fill="#f08a4b"/><circle cx="41" cy="32" r="19" fill="#ffffff"/></svg>
    </div>
    <div class="tag">Jyotish Saarthi</div>
  </div>

  <!-- Login / Signup -->
  <section id="scrAuth" class="screen">
    <main style="padding-top:30px">
      <div class="page-title" data-i18n="welcomeTitle"></div>
      <div class="page-sub" data-i18n="welcomeSub"></div>
      <div class="seg" data-langseg>
        <button data-setlang="en">English</button>
        <button data-setlang="hi">हिंदी</button>
        <button data-setlang="pa">ਪੰਜਾਬੀ</button>
      </div>
      <div class="card">
        <label for="name" data-i18n="lblName"></label>
        <input id="name" autocomplete="name" placeholder="RAHUL SHARMA" />
        <label for="dob" data-i18n="lblDob"></label>
        <input id="dob" type="date" min="1900-01-01" />
        <label for="place" data-i18n="lblPlace"></label>
        <div class="placewrap">
          <input id="place" autocomplete="off" data-i18n-ph="placePh" />
          <div id="placeList" class="sugg hidden"></div>
        </div>
        <label data-i18n="lblTime"></label>
        <label class="inline"><input type="checkbox" id="timeUnknown" /> <span data-i18n="timeUnknown"></span></label>
        <div class="timerow">
          <select id="hh" aria-label="hour"></select>
          <select id="mm" aria-label="minute"></select>
          <select id="ap" aria-label="AM/PM">
            <option value="AM" data-i18n="am"></option>
            <option value="PM" data-i18n="pm"></option>
          </select>
        </div>
        <label for="tz" data-i18n="lblTz"></label>
        <select id="tz">
          <option value="5.5" selected>India (IST, UTC+5:30)</option>
          <option value="4">UAE/Gulf (UTC+4)</option>
          <option value="0">UK/Africa (UTC+0)</option>
          <option value="-5">US East (UTC-5)</option>
          <option value="-8">US West (UTC-8)</option>
          <option value="8">Singapore/China (UTC+8)</option>
          <option value="9">Japan (UTC+9)</option>
        </select>
        <button class="btn" id="saveBtn" style="margin-top:18px" data-i18n="start"></button>
        <p class="note" data-i18n="saveNote"></p>
      </div>
      <div class="card">
        <div style="font-weight:600;margin-bottom:6px" data-i18n="loginTitle"></div>
        <p class="muted" style="font-size:14px" data-i18n="loginSub"></p>
        <input id="loginEmail" type="email" data-i18n-ph="emailPh" style="margin-top:8px" />
        <button class="btn ghost" id="loginBtn" style="margin-top:12px" data-i18n="loginBtn"></button>
        <p id="loginInfo" class="note"></p>
      </div>
    </main>
  </section>

  <!-- Main app -->
  <section id="scrApp" class="screen">
    <div class="top">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="avatar" id="avatar">?</div>
        <h1 id="hGreet"></h1>
      </div>
      <button class="circle-btn" id="btnProfile" aria-label="profile">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>

    <main>
      <div id="langBanner"></div>
      <div id="pg-home"></div>
      <div id="pg-chart" class="hidden"></div>
      <div id="pg-transits" class="hidden"></div>
      <div id="pg-listen" class="hidden"></div>

      <div id="pg-chat" class="hidden">
        <div class="page-title" style="font-size:24px" data-i18n="chatTitle"></div>
        <div class="page-sub" data-i18n="chatSub"></div>
        <div id="msgs"></div>
        <p class="note" style="text-align:center" data-i18n="chatDisclaimer"></p>
        <div style="height:80px"></div>
      </div>

      <div id="pg-profile" class="hidden">
        <div class="page-title" style="font-size:24px" data-i18n="profileTitle"></div>
        <div class="card" id="profCard" style="margin-top:14px"></div>
        <div class="card">
          <div style="font-weight:600;margin-bottom:10px" data-i18n="langTitle"></div>
          <div class="seg" data-langseg>
            <button data-setlang="en">English</button>
            <button data-setlang="hi">हिंदी</button>
            <button data-setlang="pa">ਪੰਜਾਬੀ</button>
          </div>
        </div>
        <button class="btn ghost" id="resetBtn" data-i18n="reset"></button>
        <p class="note" data-i18n="disclaimer"></p>
      </div>
    </main>

    <div class="chatbar hidden" id="chatBar">
      <input id="chatIn" type="text" data-i18n-ph="chatPh" />
      <button id="chatSend" data-i18n="send"></button>
    </div>

    <nav id="tabbar">
      <button data-pg="home" class="on" aria-label="home">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      </button>
      <button data-pg="chart" aria-label="chart">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/></svg>
      </button>
      <button data-pg="transits" aria-label="transits">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button data-pg="listen" aria-label="listen">
        <svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>
      </button>
    </nav>
  </section>

  <div class="install hidden" id="installBox">
    <span data-i18n="install"></span>
    <button id="installBtn" data-i18n="installBtn"></button>
    <button class="x" id="installX">✕</button>
  </div>
</div>

<script src="js/astro.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

const digitSum = n => String(Math.abs(n)).split('').reduce((s, c) => s + Number(c), 0);
const reduce1 = n => { let x = Math.abs(n); while (x > 9) x = digitSum(x); return x; };
const mulankOf = d => reduce1(d.getDate());
const bhagyankOf = d => reduce1(digitSum(d.getDate()) + digitSum(d.getMonth() + 1) + digitSum(d.getFullYear()));
function nameNumber(name) {
  let s = 0;
  for (const ch of name.toUpperCase()) s += CHALDEAN[ch] || 0;
  return s === 0 ? 0 : reduce1(s);
}
function endingScore(ending, m, b) {
  if (ending.length < 4) return 0;
  const reduced = reduce1(ending.split('').reduce((s, c) => s + Number(c), 0));
  let score = 0;
  if (reduced === m || reduced === b) score += 50;
  const last = Number(ending[ending.length - 1]);
  if ((LUCKY[m] || []).includes(last)) score += 25;
  if ((LUCKY[b] || []).includes(last)) score += 25;
  return score;
}
function isoWeekKey(d) {
  const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = x.getUTCDay() || 7;
  x.setUTCDate(x.getUTCDate() + 4 - dayNum);
  const y0 = new Date(Date.UTC(x.getUTCFullYear(), 0, 1));
  return x.getUTCFullYear() * 100 + Math.ceil(((x - y0) / 86400000 + 1) / 7);
}

const NAME_RASHI_GROUPS = [
  [0, ['chu','che','cho','la','li','lu','le','lo','a']],
  [1, ['i','u','e','o','va','vi','vu','ve','vo']],
  [2, ['ka','ki','ku','gh','ng','chh','ke','ko','ha']],
  [3, ['hi','hu','he','ho','da','di','du']],
  [4, ['ma','mi','mu','me','mo','ta','ti','tu','te']],
  [5, ['to','pa','pi','pu','sh','tha','pe','po']],
  [6, ['ra','ri','ru','re','ro']],
  [7, ['na','ni','nu','ne','no','ya']],
  [8, ['ye','yu','yo','bh','dh','pha']],
  [9, ['bho','ja','ji','ju','je','jo','kha','ga']],
  [10, ['gu','ge','go','sa','si','su','se','so']],
  [11, ['de','do','cha','chi','jha']],
];
const NAME_RASHI = {};
for (const [idx, prefixes] of NAME_RASHI_GROUPS) for (const p of prefixes) NAME_RASHI[p] = idx;
function nameRashiIndex(name) {
  const first = (name || '').trim().split(/\s+/)[0].toLowerCase().replace(/[^a-z]/g, '');
  for (const len of [3, 2, 1]) {
    const pre = first.slice(0, len);
    if (pre.length === len && NAME_RASHI[pre] !== undefined) return NAME_RASHI[pre];
  }
  return null;
}

function rashiIdx() { return profile && profile.chart && profile.chart.moon ? profile.chart.moon.index : 0; }
function numbersOf() {
  if (profile && profile.dob) return { m: mulankOf(profile.dob), b: bhagyankOf(profile.dob) };
  const n = nameNumber(profile.name) || 1;
  return { m: n, b: n };
}
function periodReading(p) {
  const now = new Date();
  const base = p === 'today'
    ? now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate()
    : p === 'week' ? isoWeekKey(now) : now.getFullYear();
  const salt = p === 'today' ? 0 : p === 'week' ? 1 : 2;
  const { m } = numbersOf();
  let s = (base * 31 + rashiIdx() * 7 + m * 13 + salt * 1000003) >>> 0;
  const rnd = () => { s = (Math.imul(s, 1103515245) + 12345) >>> 0; return s; };
  const list = POOL_LIST[lang] || EN_POOL_LIST;
  return POOL_KEYS.map((k, i) => ({ label: POOL_LABEL[lang] ? POOL_LABEL[lang][i] : POOL_LABEL.en[i], text: list[i][rnd() % list[i].length] }));
}

function transitInfo() {
  const c = profile && profile.chart;
  if (!c || !c.moon || !c.timeKnown) return null;
  const d = Astro.daysSince2000(Date.now());
  const ay = Astro.lahiriAyanamsa(d);
  const tMoon = ((Astro.moonLongitude(d) - ay) % 360 + 360) % 360;
  const tIdx = Math.floor(tMoon / 30);
  const house = ((tIdx - c.moon.index + 12) % 12) + 1;
  return { tMoon, tIdx, house };
}
function areaScore(i) {
  const tr = transitInfo();
  if (!tr) return 50;
  const r = TRANSIT_AREAS[i];
  if (r.good.includes(tr.house)) return 82;
  if (r.caution.includes(tr.house)) return 38;
  return 60;
}
function areaText(i) {
  const tr = transitInfo();
  const name = C().areas[i];
  if (!tr) return t('transitNeed');
  const r = TRANSIT_AREAS[i];
  if (r.good.includes(tr.house)) return t('areaGood', name);
  if (r.caution.includes(tr.house)) return t('areaCaution', name);
  return t('areaNormal', name);
}

async function geocode(place) {
  if (!place) return null;
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&addressdetails=1&q=' + encodeURIComponent(place);
    const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
    const data = await res.json();
    if (!data.length) return null;
    return { lat: Number(data[0].lat), lon: Number(data[0].lon), state: (data[0].address || {}).state || null };
  } catch { return null; }
}

async function computeChart(p) {
  const d = p.dob;
  const timeKnown = !!p.birthTime;
  if (!d || !timeKnown) {
    const idx = nameRashiIndex(p.name);
    return {
      nameBased: true, timeKnown: false, placeFound: false,
      moon: idx === null ? null : { index: idx, degree: null },
      sun: null, nakshatra: null, lagna: null,
    };
  }
  const place = p.placeCoords || await geocode(p.place);
  let c;
  try {
    c = Astro.chart({
      year: d.getFullYear(), month: d.getMonth() + 1, day: d.getDate(),
      hour: d.getHours(), minute: d.getMinutes(),
      utcOffsetHours: p.tz ?? 5.5,
      lat: place ? place.lat : null, lon: place ? place.lon : null,
    });
  } catch { return null; }
  if (!place) c.lagna = null;
  return { ...c, timeKnown: true, placeFound: !!place, state: place ? place.state : (p.placeState || null) };
}

const skeleton = s => s.toLowerCase().replace(/[^a-z]/g, '').replace(/[aeiou]/g, '').replace(/(.)\1+/g, '$1');
let selectedCoords = null;
let selectedState = null;
let placeTimer = null;

function localSuggestions(q) {
  const qs = skeleton(q);
  if (!qs) return [];
  return LOCAL_PLACES
    .filter(([city]) => {
      const cs = skeleton(city);
      return cs.startsWith(qs) || cs.includes(qs) || city.toLowerCase().startsWith(q.toLowerCase());
    })
    .slice(0, 6)
    .map(([city, state]) => ({ label: `${city}, ${state}, India`, lat: null, lon: null, state }));
}

async function onlineSuggestions(q) {
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=5&countrycodes=in&q=' + encodeURIComponent(q);
    const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
    const data = await res.json();
    return data.map(r => {
      const a = r.address || {};
      const city = a.city || a.town || a.village || a.county || a.state_district || r.name;
      return { label: [city, a.state, a.country].filter(Boolean).join(', '), lat: Number(r.lat), lon: Number(r.lon), state: a.state || null };
    });
  } catch { return []; }
}

function renderSuggestions(list) {
  const box = $('placeList');
  if (!list.length) { box.classList.add('hidden'); box.innerHTML = ''; return; }
  box.innerHTML = list.map((s, i) => `<div class="sugg-item" data-i="${i}">${esc(s.label)}</div>`).join('');
  box.classList.remove('hidden');
  box.querySelectorAll('.sugg-item').forEach(el => el.addEventListener('pointerdown', e => {
    e.preventDefault();
    const s = list[Number(el.dataset.i)];
    $('place').value = s.label;
    selectedCoords = s.lat != null && !Number.isNaN(s.lat) ? { lat: s.lat, lon: s.lon } : null;
    selectedState = s.state || null;
    box.classList.add('hidden');
  }));
}

function initPlaceSearch() {
  $('place').addEventListener('input', () => {
    selectedCoords = null;
    selectedState = null;
    const q = $('place').value.trim();
    clearTimeout(placeTimer);
    if (q.length < 2) { renderSuggestions([]); return; }
    renderSuggestions(localSuggestions(q));
    placeTimer = setTimeout(async () => {
      const online = await onlineSuggestions(q);
      if ($('place').value.trim() !== q) return;
      const seen = new Set();
      const merged = [];
      for (const s of [...online, ...localSuggestions(q)]) {
        const k = s.label.toLowerCase();
        if (!seen.has(k)) { seen.add(k); merged.push(s); }
      }
      renderSuggestions(merged.slice(0, 8));
    }, 400);
  });
  $('place').addEventListener('blur', () => setTimeout(() => $('placeList').classList.add('hidden'), 150));
}

function wheelSvg(size, markers = []) {
  const c = size / 2, R = size / 2 - 8;
  let s = `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">`;
  s += `<circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="#f08a4b" stroke-width="1.6" opacity=".8"/>`;
  s += `<circle cx="${c}" cy="${c}" r="${R * 0.74}" fill="none" stroke="#f08a4b" stroke-width="1" opacity=".5"/>`;
  s += `<circle cx="${c}" cy="${c}" r="${R * 0.44}" fill="none" stroke="#f08a4b" stroke-width="1" opacity=".35"/>`;
  for (let i = 0; i < 12; i++) {
    const a = (i * 30 - 90) * Math.PI / 180;
    const x1 = c + R * 0.44 * Math.cos(a), y1 = c + R * 0.44 * Math.sin(a);
    const x2 = c + R * Math.cos(a), y2 = c + R * Math.sin(a);
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#f08a4b" stroke-width="1" opacity=".55"/>`;
    const am = (i * 30 + 15 - 90) * Math.PI / 180;
    const tx = c + R * 0.88 * Math.cos(am), ty = c + R * 0.88 * Math.sin(am);
    s += `<text x="${tx}" y="${ty + 4}" text-anchor="middle" fill="#f08a4b" font-size="${size > 220 ? 11 : 9}" font-family="sans-serif">${esc(rashiName(i))}</text>`;
  }
  for (const m of markers) {
    const a = (m.lon - 90) * Math.PI / 180;
    const rr = R * (m.r || 0.6);
    s += `<circle cx="${c + rr * Math.cos(a)}" cy="${c + rr * Math.sin(a)}" r="${m.size || 6}" fill="${m.color || '#f08a4b'}" stroke="#141414" stroke-width="1.5"/>`;
  }
  return s + '</svg>';
}

       <button data-period="today" class="${period === 'today' ? 'on' : ''}">${t('periodToday')}</button>
       <button data-period="week" class="${period === 'week' ? 'on' : ''}">${t('periodWeek')}</button>
       <button data-period="year" class="${period === 'year' ? 'on' : ''}">${t('periodYear')}</button>
     </div>

     <div class="section-h"><span>${t('yourDay', periodLabel)}</span></div>
     <div class="hscroll">
       ${reading.slice(0, 2).map(x => `
       <div class="hcard">
         <div class="orb"></div>
         <div class="kicker">${x.label}</div>
         <h3>${esc(x.text)}</h3>
         <div class="meta">${periodLabel}</div>
       </div>`).join('')}
     </div>

     <div class="section-h"><span>${t('transitTitle')}</span><a href="#" data-pg-link="transits">${t('seeAll')}</a></div>
     <div class="rings">
       ${ring(love, t('love'))}
       ${ring(friend, t('friendship'))}
       ${ring(work, t('work'))}
     </div>
     <button class="btn" id="openChat" style="margin-bottom:6px">${t('askAi')}</button>

     <div class="section-h"><span>${t('learn')}</span></div>
     ${C().learn.map((l, i) => `
       <div class="item" data-learn="${i}" style="flex-direction:column;align-items:stretch">
         <div style="display:flex;align-items:center;gap:12px">
           <div class="body"><h4>${esc(l.t)}</h4></div>
           <button class="arrow-btn" aria-label="open">${ICON_ARROW}</button>
         </div>
         <div class="learn-body hidden">${esc(l.b)}</div>
       </div>`).join('')}

     <div class="card" style="margin-top:6px"><div class="muted" style="font-size:14px">${t('templeToday')}</div><p>${C().temples[(new Date().getDay() + 6) % 7]}</p></div>
     <p class="note">${t('funNote')}</p>`;
}
const ICON_ARROW = '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

/* ---------- कुंडली ---------- */
function renderChart() {
  const c = profile.chart;
  if (!c || c.nameBased || !c.sun) {
    const r = rashiOfProfile();
    $('pg-chart').innerHTML =
      `<div class="page-title">${t('chartTitle')}</div>
       <div class="page-sub">${t('chartNeedTime')}</div>
       ${r ? `<div class="card"><div class="muted" style="font-size:14px">${t('chartNameOnly')}</div><p style="font-size:18px;font-weight:600">${r.name} · ${r.lord}</p></div>` : `<p class="muted">${t('noRashi')}</p>`}
       <div class="card"><div class="prow"><span>${t('completeness')}</span><span>${completeness()}%</span></div>
         <div class="pbar"><i style="width:${completeness()}%"></i></div></div>`;
    return;
  }
  const sunLon = c.sun.index * 30 + c.sun.degree;
  const moonLon = c.moon.index * 30 + c.moon.degree;
  const markers = [{ lon: sunLon, color: '#f08a4b', size: 7, r: 0.6 }, { lon: moonLon, color: '#ffffff', size: 5, r: 0.6 }];
  const mulank = numbersOf().m;
  const nak = C().nak[c.nakshatra.index] || c.nakshatra.name;

  $('pg-chart').innerHTML =
    `<div class="page-title">${t('chartTitle')}</div>
     <div class="page-sub">${t('chartSub')}</div>
     <div class="card wheel">${wheelSvg(300, markers)}</div>

     <div class="card">
       <div class="prow"><span>${t('completeness')}</span><span>${completeness()}%</span></div>
       <div class="pbar"><i style="width:${completeness()}%"></i></div>
     </div>

     <div class="card">
       <div class="section-h" style="margin:0 0 8px"><span>${t('sunIn', rashiName(c.sun.index))}</span></div>
       <p>${C().sun[c.sun.index]}</p>
       <p class="muted" style="font-size:13px">${c.sun.degree}°</p>
     </div>

     <div class="card">
       <div class="row"><b>${t('moonRashi')}</b><span>${rashiName(c.moon.index)} (${c.moon.degree}°)</span></div>
       <div class="row"><b>${t('lblNak')}</b><span>${nak}, ${t('lblPada')} ${c.nakshatra.pada}</span></div>
       <div class="row"><b>${t('mulank')}</b><span>${mulank}</span></div>
       <p style="margin-top:10px">${C().traits[mulank - 1]}</p>
     </div>

     <div class="card">
       <div class="section-h" style="margin:0 0 8px"><span>${t('lagna', c.lagna ? rashiName(c.lagna.index) : t('dash'))}</span></div>
       <p>${c.lagna ? C().lagna[c.lagna.index] : t('lagnaNeed')}</p>
       ${c.lagna ? `<p class="muted" style="font-size:13px">${c.lagna.degree}°</p>` : ''}
     </div>
     <p class="note">${t('chartNote')}</p>`;
}

function completeness() {
  let n = 0;
  if (profile.name) n++;
  if (profile.dob) n++;
  if (profile.birthTime) n++;
  if (profile.place) n++;
  return Math.round((n / 4) * 100);
}

/* ---------- ट्रांज़िट ---------- */
function renderTransits() {
  const tr = transitInfo();
  if (!tr) {
    $('pg-transits').innerHTML =
      `<div class="page-title">${t('transitTitle')}</div>
       <div class="page-sub">${t('transitNeed')}</div>`;
    return;
  }
  const c = profile.chart;
  const markers = [
    { lon: tr.tMoon, color: '#ffffff', size: 8, r: 0.6 },
    { lon: c.moon.index * 30 + 15, color: '#f08a4b', size: 5, r: 0.6 },
  ];
  const cards = [0, 1, 2].map(i => `
    <div class="item" style="flex-direction:column;align-items:stretch">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h4 style="margin:0">${C().areas[i]}</h4><span class="orange" style="font-weight:700">${areaScore(i)}%</span>
      </div>
      <p style="margin-top:8px;color:#e5e5ea">${areaText(i)}</p>
    </div>`).join('');

  $('pg-transits').innerHTML =
    `<div class="page-title">${t('transitTitle')}</div>
     <div class="page-sub">${t('transitSub', rashiName(tr.tIdx), tr.house)}</div>
     <div class="card wheel">${wheelSvg(260, markers)}</div>
     ${cards}
     <p class="note">${t('transitNote')}</p>`;
}

/* ---------- सुनें ---------- */
function renderListen() {
  const ttsOk = 'speechSynthesis' in window;
  $('pg-listen').innerHTML =
    `<div class="page-title">${t('listenTitle')}</div>
     <div class="page-sub">${t('listenSub')}</div>
     ${C().listen.map((item, i) => `
       <div class="item">
         <div class="body">
           <h4>${esc(item.title)}</h4>
           <p>${esc(item.sub)}</p>
           <div style="margin-top:12px;display:flex;gap:8px;align-items:center">
             <button class="arrow-btn" data-speak="${i}" aria-label="${t('speak')}" ${ttsOk ? '' : 'disabled'}>${ICON_ARROW}</button>
             <button class="btn small ghost" data-stop="1" style="padding:7px 14px">${t('stop')}</button>
           </div>
         </div>
         <div class="planet ${['planet-moon','planet-jupiter','planet-mars'][i]}"></div>
       </div>`).join('')}
     <p class="note">${ttsOk ? t('speakNote') : t('noVoice')}</p>`;
}
function speakIdx(i) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(C().listen[i].sub);
  u.lang = lang === 'hi' ? 'hi-IN' : lang === 'pa' ? 'pa-IN' : 'en-IN';
  u.rate = 0.9;
  speechSynthesis.speak(u);
}

/* ---------- प्रोफ़ाइल ---------- */
function renderProfile() {
  const d = profile.dob;
  const tm = profile.birthTime ? `${profile.birthTime.hh}:${profile.birthTime.mm} ${profile.birthTime.ap}` : t('notKnown');
  $('profCard').innerHTML =
    `<div class="row"><b>${t('pName')}</b><span>${esc(profile.name)}</span></div>
     <div class="row"><b>${t('pDob')}</b><span>${d ? `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}` : t('dash')}</span></div>
     <div class="row"><b>${t('pPlace')}</b><span>${esc(profile.place || t('dash'))}</span></div>
     <div class="row"><b>${t('pTime')}</b><span>${tm}</span></div>`;
}

/* ============ शुरुआत ============ */
function enterApp() {
  const initial = (profile.name || '?').trim().charAt(0).toUpperCase();
  $('avatar').textContent = initial;
  applyStaticTranslations();
  showScreen('scrApp');
  showPg('home');
}

// भाषा चुनने वाला बटन (लॉगिन और प्रोफ़ाइल दोनों पर)
document.querySelectorAll('[data-setlang]').forEach(b => b.addEventListener('click', () => setLanguage(b.dataset.setlang)));

$('saveBtn').addEventListener('click', async () => {
  const name = $('name').value.trim();
  const dobVal = $('dob').value;
  if (!name) { alert(t('alertName')); return; }

  const [y, mo, da] = dobVal ? dobVal.split('-').map(Number) : [0, 0, 0];
  let birthTime = null;
  let hour24 = 0, minute = 0;
  if (dobVal && !$('timeUnknown').checked) {
    if (!$('hh').value || $('mm').value === '') { alert(t('alertTime')); return; }
    hour24 = (Number($('hh').value) % 12) + ($('ap').value === 'PM' ? 12 : 0);
    minute = Number($('mm').value);
    birthTime = { hh: $('hh').value, mm: String(minute).padStart(2, '0'), ap: $('ap').value };
  }
  profile = {
    name,
    dob: dobVal ? new Date(y, mo - 1, da, hour24, minute) : null,
    place: $('place').value.trim(),
    placeCoords: selectedCoords,
    placeState: selectedState,
    birthTime,
    tz: Number($('tz').value),
    lang,
    langAsked: false,
  };
  $('saveBtn').disabled = true;
  $('saveBtn').textContent = t('saving');
  profile.chart = await computeChart(profile);
  if (profile.chart && profile.chart.state) profile.state = profile.chart.state;
  else profile.state = profile.placeState || null;
  $('saveBtn').disabled = false;
  $('saveBtn').textContent = t('start');
  saveProfile(profile);
  syncProfile();
  enterApp();
});

document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => showPg(b.dataset.pg)));

$('langBanner').addEventListener('click', e => {
  const yes = e.target.closest('[data-bn-yes]');
  const no = e.target.closest('[data-bn-no]');
  if (yes) { profile.langAsked = true; saveProfile(profile); setLanguage(yes.dataset.bnYes); }
  if (no) { profile.langAsked = true; saveProfile(profile); renderLangBanner(); }
});

$('pg-home').addEventListener('click', e => {
  const p = e.target.closest('[data-period]');
  if (p) { period = p.dataset.period; renderHome(); return; }
  if (e.target.closest('#openChat')) { showPg('chat'); return; }
  const link = e.target.closest('[data-pg-link]');
  if (link) { e.preventDefault(); showPg(link.dataset.pgLink); return; }
  const learn = e.target.closest('[data-learn]');
  if (learn) learn.querySelector('.learn-body').classList.toggle('hidden');
});

$('pg-listen').addEventListener('click', e => {
  const s = e.target.closest('[data-speak]');
  if (s) { speakIdx(Number(s.dataset.speak)); return; }
  if (e.target.closest('[data-stop]') && 'speechSynthesis' in window) speechSynthesis.cancel();
});

$('btnProfile').addEventListener('click', () => showPg('profile'));
$('resetBtn').addEventListener('click', () => {
  if (!confirm(t('resetConfirm'))) return;
  clearProfile();
  profile = null;
  ['name', 'dob', 'place'].forEach(id => $(id).value = '');
  showScreen('scrAuth');
});

$('chatSend').addEventListener('click', sendChat);
$('chatIn').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });

/* PWA */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; $('installBox').classList.remove('hidden'); });
$('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  $('installBox').classList.add('hidden');
});
$('installX').addEventListener('click', () => $('installBox').classList.add('hidden'));

/* boot */
profile = loadProfile();
if (profile && profile.lang) lang = profile.lang;
fillTimeSelects();
initPlaceSearch();
initLogin();
applyStaticTranslations();
setTimeout(() => {
  $('splash').classList.add('gone');
  setTimeout(() => {
    $('splash').style.display = 'none';
    if (profile) enterApp(); else showScreen('scrAuth');
  }, 400);
}, 1500);
</script>
</body>
</html>
